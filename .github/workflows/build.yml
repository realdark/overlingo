# Build and automated check of Overlingo for Windows, Linux and macOS.
#
# When it runs:
#   - manually: Actions -> "Build" -> "Run workflow" (trial build; the archives
#     are under "Artifacts" at the bottom of the run page, kept for 14 days);
#   - on a published GitHub release: builds and attaches the archives to it.
#     The tag must be "v" + APP_VERSION from utils/version.py (e.g. v3.3) -
#     otherwise the app's update check goes wrong, so the build stops.
#
# For each OS: tests -> build -> download a small offline translation
# model -> "overlingo --self-test" on the FINISHED build (see core/selftest.py).

name: Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  # Python writes UTF-8 to logs on Windows too (otherwise non-ASCII text crashes).
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        # GitHub's Ubuntu package mirror sometimes hangs - fail fast instead of waiting.
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y tesseract-ocr libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          # Qt, pynput, audio and network are stubbed (see tests/_stubs.py);
          # the real build is checked separately with --self-test.
          OVERLINGO_TEST_STUBS: "1"
        run: python -m unittest discover -s tests -t . -v

  version:
    name: Check release tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must be v + APP_VERSION
        run: |
          VERSION="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' utils/version.py)"
          TAG="${{ github.event.release.tag_name }}"
          echo "APP_VERSION=$VERSION, tag=$TAG"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match APP_VERSION $VERSION (expected v$VERSION) - fix utils/version.py or the tag."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: [version]
    # On a manual run "version" is skipped - the build runs anyway.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            artifact: Overlingo-windows-x64
          - name: Linux
            artifact: Overlingo-linux-x86_64
            os: ubuntu-22.04        # older glibc - the build also runs on older distros
          - name: macOS Apple Silicon
            os: macos-14
            artifact: Overlingo-macos-apple-silicon
          - name: macOS Intel
            os: macos-15-intel
            artifact: Overlingo-macos-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Tesseract and system libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y tesseract-ocr libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract -y --no-progress
      - name: Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Python packages
        run: pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call build.bat
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash build.sh
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash build_macos.sh

      - name: Download a model for the offline translation check
        shell: bash
        run: python tools/fetch_argos_model.py "$RUNNER_TEMP/argos-models" en de

      - name: Self-test of the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The build has no console - the result is in the log file and the exit code.
          $log = Join-Path $env:RUNNER_TEMP "selftest.log"
          $models = Join-Path $env:RUNNER_TEMP "argos-models"
          $p = Start-Process -FilePath "dist\overlingo\overlingo.exe" -Wait -PassThru `
            -ArgumentList "--self-test", "--require-argos", "--argos-models", $models, "--log", $log
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No selftest.log - the app never reached the check" }
          exit $p.ExitCode
      - name: Self-test of the built app (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/overlingo/overlingo --self-test --require-argos --argos-models "$RUNNER_TEMP/argos-models" --log "$RUNNER_TEMP/selftest.log"
      - name: Self-test of the built app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Overlingo.app/Contents/MacOS/Overlingo --self-test --require-argos --argos-models "$RUNNER_TEMP/argos-models" --log "$RUNNER_TEMP/selftest.log"

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Overlingo-*.zip
            dist/Overlingo-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Logs when something failed
        if: failure()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP/selftest.log" dist/overlingo/app.log dist/overlingo/crash.log \
                   "$HOME/Library/Application Support/Overlingo/app.log" \
                   "$HOME/Library/Application Support/Overlingo/crash.log"; do
            if [ -f "$f" ]; then echo "===== $f"; cat "$f"; fi
          done

  release:
    name: Attach to release
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*
